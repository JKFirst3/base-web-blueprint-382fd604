name: Funnel Admin Checks
on:
  push:
    branches: [feat/agentic-funnel-admin-audit]
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/**'
      - 'public/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/funnel-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify committed Prettier formatting
        run: bunx prettier --check src/lib/admin/*.ts src/components/admin/*.tsx src/lib/lead-request.server*.ts src/routes/admin/funnel.tsx src/routes/api/admin/*.ts src/routes/api/public/leads.ts src/routes/api/public/preorders.ts src/routes/Konfigurator.tsx src/components/site/CodexPage.tsx src/components/site/Footer.tsx src/routes/__root.tsx src/routes/index.tsx src/lib/mcp/tools/get-funnel-snapshot.ts src/lib/mcp/index.ts >/dev/null
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - name: HTTP smoke test for real admin endpoints
        env:
          FUNNEL_ADMIN_PASSWORD: ci-only-funnel-password-never-production
          FUNNEL_ADMIN_SESSION_SECRET: ci-only-session-signing-key-longer-than-32-characters
        run: |
          bun run dev --host 127.0.0.1 > /tmp/funnel-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/funnel-http-smoke.mjs || { tail -n 80 /tmp/funnel-server.log; exit 1; }
      - name: Lint changed TypeScript files
        run: bunx eslint src/lib/admin/*.ts src/lib/lead-request.server*.ts src/routes/admin/funnel.tsx src/routes/api/admin/*.ts src/routes/api/public/leads.ts src/routes/api/public/preorders.ts src/routes/Konfigurator.tsx src/components/site/CodexPage.tsx src/components/site/Footer.tsx src/routes/__root.tsx src/routes/index.tsx src/lib/mcp/tools/get-funnel-snapshot.ts src/lib/mcp/index.ts src/components/admin/*.tsx
