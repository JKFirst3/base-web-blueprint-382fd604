name: Funnel Admin Checks
on:
  push:
    branches: [feat/agentic-funnel-admin-audit]
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/funnel-checks.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Produce formatted code for branch review (no auto-commit)
        run: |
          bunx prettier --write src/lib/admin/*.ts src/lib/lead-request.server*.ts src/routes/admin/funnel.tsx src/routes/api/admin/*.ts src/routes/api/public/leads.ts src/components/site/CodexPage.tsx src/components/site/Footer.tsx src/routes/__root.tsx src/routes/index.tsx src/lib/mcp/tools/get-funnel-snapshot.ts src/lib/mcp/index.ts >/dev/null
          bunx eslint --fix src/lib/admin/*.ts src/lib/lead-request.server*.ts src/routes/admin/funnel.tsx src/routes/api/admin/*.ts src/routes/api/public/leads.ts src/components/site/CodexPage.tsx src/components/site/Footer.tsx src/routes/__root.tsx src/routes/index.tsx src/lib/mcp/tools/get-funnel-snapshot.ts src/lib/mcp/index.ts >/dev/null
          node - <<'NODE'
          const fs = require('node:fs');
          const paths = ["src/lib/admin/funnel-connectors.server.ts","src/lib/admin/funnel-connectors.server.test.ts","src/lib/admin/funnel-data.server.ts","src/lib/admin/funnel-session.server.ts","src/lib/admin/funnel-session.server.test.ts","src/lib/lead-request.server.ts","src/lib/lead-request.server.test.ts","src/routes/admin/funnel.tsx","src/routes/api/admin/funnel.ts","src/routes/api/admin/funnel-qualification.ts","src/routes/api/admin/funnel-session.ts","src/routes/api/public/leads.ts","src/components/site/CodexPage.tsx","src/components/site/Footer.tsx","src/routes/__root.tsx","src/routes/index.tsx","src/lib/mcp/tools/get-funnel-snapshot.ts","src/lib/mcp/index.ts"];
          for (const path of paths) console.log('FMTFILE=' + JSON.stringify({ path, content: fs.readFileSync(path, 'utf8') }));
          NODE
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - name: Lint changed TypeScript files
        run: bunx eslint src/lib/admin/*.ts src/lib/lead-request.server*.ts src/routes/admin/funnel.tsx src/routes/api/admin/*.ts src/routes/api/public/leads.ts src/components/site/CodexPage.tsx src/components/site/Footer.tsx src/routes/__root.tsx src/routes/index.tsx src/lib/mcp/tools/get-funnel-snapshot.ts src/lib/mcp/index.ts
